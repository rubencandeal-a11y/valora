<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        @font-face {
          font-family: "Fraunces";
          src: url("../assets/fonts/Fraunces.ttf") format("truetype");
          font-weight: 100 900;
          font-style: normal;
        }
        @font-face {
          font-family: "Fraunces";
          src: url("../assets/fonts/Fraunces-Italic.ttf") format("truetype");
          font-weight: 100 900;
          font-style: italic;
        }
        #intro-root {
          position: absolute;
          inset: 0;
          overflow: hidden;
        }
        #intro-content {
          padding-bottom: 120px;
        }
        #intro-date {
          font-family: Montserrat, sans-serif;
          font-weight: 700;
          font-size: 30px;
          letter-spacing: 0.32em;
          padding-left: 0.32em;
          text-transform: uppercase;
          color: var(--cream);
        }
        .intro-title {
          font-family: "Fraunces", serif;
          font-style: italic;
          font-weight: 400;
          font-variation-settings: "SOFT" 100, "WONK" 0, "opsz" 144;
          font-size: 132px;
          line-height: 1.02;
          letter-spacing: -0.02em;
          color: var(--ink);
          text-shadow: 0 6px 40px rgba(5, 20, 50, 0.45);
        }
        .intro-title .line {
          display: block;
        }
        #intro-reflection-wrap {
          position: relative;
          width: 100%;
          height: 300px;
          margin-top: 6px;
          overflow: hidden;
          -webkit-mask-image: linear-gradient(180deg, rgba(0, 0, 0, 0.6) 0%, rgba(0, 0, 0, 0) 80%);
          mask-image: linear-gradient(180deg, rgba(0, 0, 0, 0.6) 0%, rgba(0, 0, 0, 0) 80%);
        }
        #intro-reflection {
          position: absolute;
          left: 0;
          right: 0;
          top: 0;
          filter: url(#intro-ripple-filter) blur(1.5px);
        }
        #intro-reflection .intro-title {
          display: block;
          transform: scaleY(-1);
          text-shadow: none;
          color: #cfe0f5;
        }
      </style>

      <div id="intro-root" data-composition-id="intro" data-width="1080" data-height="1920">
        <svg width="0" height="0" style="position: absolute">
          <defs>
            <filter id="intro-ripple-filter" x="-10%" y="-10%" width="120%" height="120%">
              <feTurbulence type="fractalNoise" baseFrequency="0.006 0.07" numOctaves="2" seed="7" result="noise" />
              <feOffset id="intro-ripple-offset" in="noise" dx="0" dy="0" result="moved" />
              <feDisplacementMap in="SourceGraphic" in2="moved" scale="26" xChannelSelector="R" yChannelSelector="G" />
            </filter>
          </defs>
        </svg>
        <div class="water"></div>
        <svg data-layout-allow-overflow class="ripples" id="intro-ripples" viewBox="0 0 1400 1920"></svg>
        <svg data-layout-allow-overflow class="rings" id="intro-rings" viewBox="0 0 1080 1920"></svg>
        <div class="vignette"></div>
        <div class="stack" id="intro-content">
          <div id="intro-date">{{FECHA}}</div>
          <span class="rule" id="intro-rule"></span>
          <h1 class="intro-title" id="intro-title">
            <span class="line"><span class="word">Maravillado</span></span>
            <span class="line"><span class="word">estoy </span><span class="word">de </span><span class="word">ti</span></span>
          </h1>
          <div id="intro-reflection-wrap" data-layout-allow-overflow>
            <div id="intro-reflection">
              <div class="intro-title">
                <span class="line">Maravillado</span>
                <span class="line">estoy de ti</span>
              </div>
            </div>
          </div>
        </div>
      </div>

      <script>
        (function () {
          const lines = window.Water.buildRipples(document.getElementById("intro-ripples"), 11);
          const rings = window.Water.buildRings(document.getElementById("intro-rings"), 1240, 3);
          const tl = gsap.timeline({ paused: true });

          // Ambient water: ripple lines drift, drop rings spread from behind the title.
          lines.forEach((l) => {
            tl.fromTo(l.el, { x: 0 }, { x: l.dir * l.speed * 3.4, duration: 3.4, ease: "none" }, 0);
          });
          rings.forEach((r, k) => {
            const t0 = 0.15 + k * 0.32;
            tl.fromTo(r, { scale: 0.05 }, { scale: 1.6, duration: 2.4, ease: "power2.out" }, t0);
            tl.fromTo(r, { opacity: 0 }, { opacity: 0.35, duration: 0.25, ease: "none" }, t0);
            tl.to(r, { opacity: 0, duration: 1.6, ease: "power1.in" }, t0 + 0.4);
          });
          tl.fromTo("#intro-ripple-offset", { attr: { dy: 0 } }, { attr: { dy: 140 }, duration: 3.4, ease: "none" }, 0);

          // Type: date, terracotta rule, title word by word, then its reflection settles on the water.
          tl.fromTo("#intro-date", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 1.0, ease: "power3.out" }, 0.2);
          tl.fromTo("#intro-rule", { scaleX: 0 }, { scaleX: 1, duration: 0.9, ease: "power3.inOut" }, 0.35);
          tl.fromTo(
            "#intro-title .word",
            { opacity: 0, y: 46, filter: "blur(14px)" },
            { opacity: 1, y: 0, filter: "blur(0px)", duration: 1.0, ease: "power3.out", stagger: 0.14 },
            0.45,
          );
          tl.fromTo("#intro-reflection", { opacity: 0, y: -30 }, { opacity: 0.6, y: 0, duration: 1.2, ease: "power2.out" }, 0.9);

          // Exit: content lifts and softens as the ripple opens onto the clip.
          tl.to("#intro-content", { y: -60, opacity: 0, filter: "blur(8px)", duration: 0.8, ease: "power2.in" }, 2.45);

          window.__timelines["intro"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
